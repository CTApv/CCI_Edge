name: Docker images

on:
  push:
    branches:
      - main
      - docker-pilot
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/ctapv/pv-guardian-edge-backend
  WEB_IMAGE: ghcr.io/ctapv/pv-guardian-edge-web

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: ghcr.io/ctapv/pv-guardian-edge-backend
            dockerfile: backend/Dockerfile
          - component: web
            image: ghcr.io/ctapv/pv-guardian-edge-web
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build metadata
        id: build_meta
        shell: bash
        run: |
          version="v1.0.0"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "label=${version}-${GITHUB_REF_NAME}-${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"
          echo "commit=${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PV_EDGE_MANAGER_VERSION=${{ steps.build_meta.outputs.version }}
            PV_EDGE_MANAGER_BUILD_LABEL=${{ steps.build_meta.outputs.label }}
            PV_EDGE_MANAGER_BUILD_COMMIT=${{ steps.build_meta.outputs.commit }}
            PV_EDGE_MANAGER_BUILD_TIME=${{ steps.build_meta.outputs.time }}
